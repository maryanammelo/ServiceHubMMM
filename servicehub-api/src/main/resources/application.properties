spring.application.name=servicehub-api

spring.datasource.url=jdbc:postgresql://localhost:5432/servicehub
spring.datasource.username=postgres
spring.datasource.password=${SERVICEHUB_DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8080

springdoc.swagger-ui.path=/swagger-ui.html

servicehub.jwt.secret=${SERVICEHUB_JWT_SECRET}
servicehub.jwt.expiration-minutes=${SERVICEHUB_JWT_EXPIRATION_MINUTES:60}

server.error.include-stacktrace=never
